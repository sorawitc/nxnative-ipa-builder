
name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose target device"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools backports.zstd gdown

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local result source_type file_id
            local share_api_url download_url
            local content_type http_code
            local tmp="${output}.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::Required download URL is empty."
              return 1
            fi

            result="$(python - "$url" <<'PY'
          import base64
          import re
          import sys
          from urllib.parse import (
              parse_qsl, parse_qs, urlencode, urlparse, urlunparse
          )

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()
          query = parse_qs(parsed.query)
          file_id = None

          if host in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url

          if file_id:
              print(f"google|{file_id}||")
              raise SystemExit(0)

          is_onedrive = (
              host in ("1drv.ms", "onedrive.live.com")
              or host.endswith(".sharepoint.com")
              or host.endswith(".onedrive.com")
          )

          if parsed.scheme != "https" or not is_onedrive:
              raise SystemExit(
                  "Unsupported link. Use a Google Drive file ID "
                  "or HTTPS OneDrive sharing URL."
              )

          encoded = base64.urlsafe_b64encode(
              url.encode("utf-8")
          ).decode("ascii").rstrip("=")

          api_url = (
              "https://api.onedrive.com/v1.0/shares/u!"
              + encoded
              + "/root/content"
          )

          pairs = [
              (k, v) for k, v in
              parse_qsl(parsed.query, keep_blank_values=True)
              if k.lower() != "download"
          ]
          pairs.append(("download", "1"))
          direct_url = urlunparse(
              parsed._replace(query=urlencode(pairs))
          )

          print(f"onedrive||{api_url}|{direct_url}")
          PY
          )"

            IFS='|' read -r \
              source_type file_id share_api_url download_url <<< "$result"

            echo "Downloading $(basename "$output")..."

            if [[ "$source_type" == "google" ]]; then
              gdown "$file_id" -O "$output"
            else
              rm -f "$tmp"

              # Attempt 1: Follow the OneDrive sharing link.
              if content_type="$(
                curl --silent --show-error --location \
                  --retry 3 --connect-timeout 30 \
                  --user-agent "Mozilla/5.0" \
                  --output "$tmp" \
                  --write-out '%{content_type}' \
                  "$download_url"
              )"; then
                http_code="200"
              else
                http_code="000"
              fi

              # Reject HTML pages and empty responses.
              if [[ "$http_code" == "200" ]] \
                && [[ -s "$tmp" ]] \
                && [[ "$content_type" != text/html* ]] \
                && ! python - "$tmp" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          head = p.read_bytes()[:4096].lstrip().lower()
          is_html = head.startswith(
              (b"<!doctype html", b"<html", b"<head")
          )
          raise SystemExit(0 if is_html else 1)
          PY
              then
                mv "$tmp" "$output"
              else
                # Attempt 2: Legacy OneDrive content endpoint.
                rm -f "$tmp"
                echo "Direct download failed; trying fallback endpoint."

                if content_type="$(
                  curl --silent --show-error --location \
                    --retry 2 --connect-timeout 30 \
                    --user-agent "Mozilla/5.0" \
                    --output "$tmp" \
                    --write-out '%{content_type}' \
                    "$share_api_url"
                )"; then
                  http_code="200"
                else
                  http_code="000"
                fi

                if [[ "$http_code" == "200" ]] \
                  && [[ -s "$tmp" ]] \
                  && [[ "$content_type" != text/html* ]] \
                  && ! python - "$tmp" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          head = p.read_bytes()[:4096].lstrip().lower()
          is_html = head.startswith(
              (b"<!doctype html", b"<html", b"<head")
          )
          raise SystemExit(0 if is_html else 1)
          PY
                then
                  mv "$tmp" "$output"
                else
                  rm -f "$tmp"
                  echo "::error::OneDrive download failed."
                  echo "::error::Direct Content-Type: ${content_type:-unknown}"
                  echo "::error::HTTP status: ${http_code:-unknown}"
                  echo "::error::Verify anonymous access and file sharing URL."
                  return 1
                fi
              fi
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              return 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No update configured."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC configured."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract archives and prepare game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          rar_signatures = (b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")

          def validate(path):
              with path.open("rb") as f:
                  magic = f.read(4)
              suffix = path.suffix.lower()
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(f"Invalid NSP/NSZ signature: {path.name}")
              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(f"Invalid XCI/XCZ signature: {path.name}")

          def add_package(source, label):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit(f"Duplicate package: {source.name}")
              validate(source)
              shutil.copy2(source, target)
              print(f"Added {label}: {target.name}")

          for label in ("game", "update", "dlc"):
              source = work / f"{label}.download"
              if not source.exists():
                  continue

              with source.open("rb") as f:
                  signature = f.read(8)

              if any(signature.startswith(s) for s in rar_signatures):
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  subprocess.run(
                      ["unar", "-o", str(extract_dir), str(source)],
                      check=True
                  )
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in extensions
                  )
                  if not packages:
                      raise SystemExit(f"No game packages in {label} archive.")
                  for package in packages:
                      add_package(package, label)
              else:
                  if signature[:4] == b"PFS0":
                      ext = ".nsp"
                  elif signature[:4] == b"HEAD":
                      ext = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR, NSP or XCI."
                      )
                  target = game_dir / f"{label}{ext}"
                  shutil.copy2(source, target)
                  validate(target)
                  print(f"Added direct package: {target.name}")

          packages = [
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in extensions
          ]
          if not packages:
              raise SystemExit("No game packages were prepared.")
          if not (work / "prod.keys").is_file():
              raise SystemExit("prod.keys is missing.")
          print("Prepared packages:", len(packages))
          PY

      - name: Detect title ID and select profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []
                      names = []
                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end >= 0:
                              names.append(
                                  strings[offset:end].decode(errors="replace")
                              )
                      return names
              except (OSError, struct.error):
                  return []

          candidates = set()
          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik", name
                  )
                  if match:
                      title_id = int(match.group(1), 16)
                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")
              match = re.search(r"\[([0-9A-Fa-f]{16})\]", path.name)
              if match:
                  title_id = int(match.group(1), 16)
                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  f"Cannot uniquely identify base title ID: {sorted(candidates)}"
              )
          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be 16 hexadecimal characters."
            exit 1
          fi

          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"
          echo "Detected title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"

      - name: Generate shader toolchain header
        shell: bash
        run: |
          set -euo pipefail
          CHAIN_SCRIPT="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
