
name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # nxnative needs the Xcode 27.1 / iOS 27 SDK (CMMotionManager.deviceMotionBody,
    # and the Metal toolchain the shaders were tested with). macos-latest still
    # resolves to an older image, so pin the macOS 27 image explicitly.
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Select Xcode 27.1 and verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          # On the macos-27 image Xcode 27.1 may be named either
          # Xcode_27.1.app or Xcode_27.1_Release_Candidate.app
          # (actions/runner-images issue #15000). Pick whichever exists.
          XCODE_APP=""
          for candidate in \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.1_Release_Candidate.app; do
            if [[ -d "$candidate" ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [[ -z "$XCODE_APP" ]]; then
            echo "::error::Xcode 27.1 was not found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -i ios || true
          echo "=== Metal compiler ==="
          xcrun metal --version 2>&1 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install glslang xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_candidate() {
            local url="$1"
            local output="$2"
            local response
            local content_type
            local cookie_jar
            local curl_status

            # OneDrive/SharePoint sharing links set cookies during the
            # redirect chain; without a cookie jar curl lands on the
            # sign-in page (HTTP 200 + HTML) instead of the file.
            cookie_jar="$(mktemp)"

            EFFECTIVE_URL=""
            response="$(
              curl --silent --show-error --fail --location \
                --retry 3 --connect-timeout 30 \
                --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
                --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36 Edg/129.0.0.0' \
                --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
                --header 'Accept-Language: en-US,en;q=0.9' \
                --output "$output" \
                --write-out '%{content_type}\n%{url_effective}' \
                "$url"
            )"
            curl_status=$?
            rm -f "$cookie_jar"

            if [[ "$curl_status" -ne 0 ]]; then
              return 1
            fi

            content_type="${response%%$'\n'*}"
            EFFECTIVE_URL="${response#*$'\n'}"
            [[ "$content_type" != text/html* ]] \
              && ! python - "$output" <<'PY'
          import sys
          from pathlib import Path

          prefix = Path(sys.argv[1]).read_bytes()[:2048].lstrip().lower()
          raise SystemExit(
              0 if prefix.startswith((b"<!doctype html", b"<html", b"<head"))
              else 1
          )
          PY
          }

          download_file() {
            local url="$1"
            local output="$2"
            local source_type
            local file_id
            local share_api_url
            local resolved_share_api_url
            local api_candidate
            local last_api_candidate
            local downloaded
            local download_url
            local result
            local temporary_output="${output}.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            result="$(python - "$url" <<'PY'
          import base64
          import re
          import sys
          from urllib.parse import (
              parse_qsl,
              parse_qs,
              urlencode,
              urlparse,
              urlunparse,
          )

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if file_id:
              print(f"google|{file_id}||")
              raise SystemExit(0)

          host = (parsed.hostname or "").lower()
          is_onedrive = (
              host in ("1drv.ms", "onedrive.live.com")
              or host.endswith(".sharepoint.com")
              or host.endswith(".onedrive.com")
          )

          if parsed.scheme != "https" or not is_onedrive:
              raise SystemExit(
                  "Unsupported download link. Use a Google Drive file ID "
                  "or an HTTPS OneDrive sharing link."
              )

          share_id = "u!" + base64.urlsafe_b64encode(
              url.encode()
          ).decode().rstrip("=")
          api_url = (
              "https://api.onedrive.com/v1.0/shares/"
              + share_id
              + "/root/content"
          )
          download_query = [
              (key, value)
              for key, value in parse_qsl(
                  parsed.query, keep_blank_values=True
              )
              if key.lower() != "download"
          ]
          download_query.append(("download", "1"))
          download_url = urlunparse(
              parsed._replace(query=urlencode(download_query))
          )
          print(f"onedrive||{api_url}|{download_url}")
          PY
          )"

            echo "Downloading $(basename "$output")..."
            IFS='|' read -r \
              source_type file_id share_api_url download_url <<< "$result"

            if [[ "$source_type" == "google" ]]; then
              gdown "$file_id" -O "$output"
            else
              if download_candidate "$download_url" "$temporary_output"; then
                mv "$temporary_output" "$output"
              elif [[ "$source_type" == "onedrive" ]]; then
                rm -f "$temporary_output"
                resolved_share_api_url="$(
                  python - "$EFFECTIVE_URL" "$share_api_url" <<'PY'
          import base64
          import sys
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse

          url, fallback = sys.argv[1:]
          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()
          is_onedrive = (
              host in ("1drv.ms", "onedrive.live.com")
              or host.endswith(".sharepoint.com")
              or host.endswith(".onedrive.com")
          )

          if parsed.scheme != "https" or not is_onedrive:
              print(fallback)
              raise SystemExit(0)

          query = [
              (key, value)
              for key, value in parse_qsl(
                  parsed.query, keep_blank_values=True
              )
              if key.lower() != "download"
          ]
          canonical_url = urlunparse(
              parsed._replace(query=urlencode(query))
          )
          share_id = "u!" + base64.urlsafe_b64encode(
              canonical_url.encode()
          ).decode().rstrip("=")
          print(
              "https://api.onedrive.com/v1.0/shares/"
              + share_id
              + "/root/content"
          )
          PY
                )"
                downloaded="false"
                last_api_candidate=""
                for api_candidate in \
                  "$resolved_share_api_url" "$share_api_url"; do
                  if [[ "$downloaded" == "true" ]] \
                    || [[ "$api_candidate" == "$last_api_candidate" ]]; then
                    continue
                  fi
                  last_api_candidate="$api_candidate"

                  if [[ -s "$temporary_output" ]]; then
                    rm -f "$temporary_output"
                  fi

                  if download_candidate \
                    "$api_candidate" "$temporary_output"; then
                    mv "$temporary_output" "$output"
                    downloaded="true"
                    break
                  fi
                done

                if [[ "$downloaded" != "true" ]]; then
                  rm -f "$temporary_output"
                  echo "::error::OneDrive did not return a file. Set sharing to 'Anyone with the link' and use a direct file sharing link."
                  exit 1
                fi
              else
                rm -f "$temporary_output"
                echo "::error::The URL did not return a downloadable file."
                exit 1
              fi
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.copy2(source, target)

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.copy2(source, target)
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Generate shader toolchain header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
